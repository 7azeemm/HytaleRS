[workspace]
resolver = "3"
members = [
    "server",
    "protocol",
    "macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
incremental = true

[workspace.lints.rust]
warnings = "allow"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.dependencies]
server = { path = "server" }
protocol = { path = "protocol" }
macros = { path = "macros" }

tokio = { version = "1.49.0", features = ["fs", "time", "rt", "rt-multi-thread", "macros"] }
log = "0.4.29"
chrono = { version = "0.4.43",features = ["serde"] }
colored = "3.1.1"
once_cell = "1.21.3"
clap = { version = "4.5.54", features = ["derive"] }
parking_lot = "0.12.5"
crossbeam = "0.8.4"
ahash = "0.8.12"
rayon = "1.11.0"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
semver = { version = "1.0.27", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
crossbeam-channel = "0.5.15"
criterion = "0.8.1"
rcgen = "0.14.7"
rustls = "0.23.36"
quinn = "0.11.9"
anyhow = "1.0.100"
futures = "0.3.31"
quote = "1.0.44"
syn = "2.0.114"
proc-macro2 = "1.0.105"
async-trait = "0.1.89"
memchr = "2.7.6"
num_enum = "0.7.5"
strum = "0.27.2"
strum_macros = "0.27.2"
reqwest = "0.13.1"
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
regex = "1.12.2"
pbkdf2 = "0.13.0-rc.8"
aes-gcm = "0.11.0-rc.2"
sha2 = "0.11.0-rc.4"
rand = "0.10.0"
bson = { version = "3.1.0",features = ["serde"] }
url = "2.5.8"
base64 = "0.22.1"
subtle = "2.6.1"
zstd = "0.13.3"
zip = "7.3.0-pre1"
bytes = "1.11.0"
inventory = "0.3.21"
glam = { version = "0.32.0", features = ["serde"] }
serde_repr = "0.1.20"
derive_more = { version = "2.1.1", features = ["from"] }
ordered-float = "5.1.0"